# ==============================================================================
# E3 Rentals Qatar — Multi-Service Production Docker Compose Stack
# Next.js Standalone + Nginx Reverse Proxy (SSL) + PostgreSQL 16 + Redis 7 + Certbot
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Next.js 16 Standalone Application
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e3-rentals-app
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env.production
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - e3-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. Nginx Reverse Proxy & SSL Termination
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: e3-rentals-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - e3-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL 16 Production Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: e3-rentals-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-e3admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisToAStrongSecretPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-e3_rentals_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./deploy/backups:/backups
    ports:
      # Bound strictly to localhost to isolate database from public WAN
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-e3admin} -d ${POSTGRES_DB:-e3_rentals_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - e3-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 4. Redis 7 High-Throughput Memory Cache & Job Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: e3-rentals-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-ChangeThisToAStrongRedisPassword2026!} 
      --appendonly yes 
      --maxmemory 512mb 
      --maxmemory-policy volatile-lru
    volumes:
      - redis_prod_data:/data
    ports:
      # Bound strictly to localhost
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeThisToAStrongRedisPassword2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - e3-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. Let's Encrypt Certbot Certificate Auto-Renewal Daemon
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: e3-rentals-certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - e3-prod-network

# ------------------------------------------------------------------------------
# Networks & Storage Volumes
# ------------------------------------------------------------------------------
networks:
  e3-prod-network:
    name: e3-prod-network
    driver: bridge

volumes:
  postgres_prod_data:
    name: e3_postgres_prod_data
  redis_prod_data:
    name: e3_redis_prod_data
  certbot_certs:
    name: e3_certbot_certs
  certbot_www:
    name: e3_certbot_www
  nginx_logs:
    name: e3_nginx_logs
