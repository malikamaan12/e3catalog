# ==============================================================================
# E3 Rentals Qatar — Production Nginx Reverse Proxy Configuration
# Optimized for Next.js 16 Standalone, WebSocket Radar Streams & High Concurrency
# ==============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging Formats
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main buffer=16k flush=2m;

    # Performance Tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens   off;
    client_max_body_size 50M;

    # Compression Configuration (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones
    # Global API Limiter: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    # Auth & Login Limiter: 10 requests/minute per IP (Brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    # Connection Limiter: Max 50 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # Next.js Application Upstream
    upstream nextjs_upstream {
        server app:3000;
        keepalive 64;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP Server — Port 80 (Let's Encrypt Challenge & HTTPS Redirection)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name rentals.e3qatar.com localhost;

        # ACME-challenge for Let's Encrypt automated renewals
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Healthcheck endpoint bypass for Docker / Cloud Balancers over HTTP
        location = /api/health {
            proxy_pass http://nextjs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS Server — Port 443 (SSL Termination, WebSockets & Security Headers)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rentals.e3qatar.com localhost;

        # SSL Certificates (Mounted from Host / Certbot volume)
        ssl_certificate     /etc/letsencrypt/live/rentals.e3qatar.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rentals.e3qatar.com/privkey.pem;

        # SSL Security Parameters (Mozilla Modern Profile)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

        # Connection Limit
        limit_conn conn_zone 50;

        # ----------------------------------------------------------------------
        # Live WebSocket & Server-Sent Events (GPS Radar & Real-Time Telemetry)
        # ----------------------------------------------------------------------
        location /api/driver/gps/stream {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Long timeouts for persistent telemetry streams
            proxy_connect_timeout 60s;
            proxy_send_timeout    86400s;
            proxy_read_timeout    86400s;

            # Disable buffering for instant coordinate streaming
            proxy_buffering off;
            proxy_cache off;
        }

        # ----------------------------------------------------------------------
        # Authentication Rate Limiting (/api/auth/*)
        # ----------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=auth_zone burst=5 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ----------------------------------------------------------------------
        # General API Rate Limiting (/api/*)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ----------------------------------------------------------------------
        # Static Assets & Immutable Bundles
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Immutable cache for 1 year (Next.js chunk hashes ensure cache-busting)
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Service Worker (PWA) — MUST NEVER BE CACHED
        location = /sw.js {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
            access_log off;
        }

        # Web App Manifest & Favicons
        location ~* \.(manifest\.json|webmanifest|ico)$ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # Media & Public Static Files
        location ~* \.(jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|otf|mp4|webm)$ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 30d;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Default Next.js App Route
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Proxy buffering settings
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # Custom Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
